    fields:
      name: Description
      code: Code

  sale:
    entity_set: Document_РеализацияТоваровУслуг
    fields:
      counterparty: Контрагент_Key   # TODO(verify)
      total: СуммаДокумента          # TODO(verify)

  customer_order:
    entity_set: Document_ЗаказКлиента
    fields:
      counterparty: Контрагент_Key   # TODO(verify)
      total: СуммаДокумента          # TODO(verify)
