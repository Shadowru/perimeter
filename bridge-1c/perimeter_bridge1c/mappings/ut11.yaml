# Маппинг для «Управление торговлей 11». Состав объектов отличается от БП 3.0.
# TODO(verify): весь файл — черновик, сверить с $metadata живой УТ 11 (документы
# реализации/заказов в УТ называются иначе: РеализацияТоваровУслуг есть,
# счёт на оплату отсутствует как отдельный документ — используется ЗаказКлиента).

configuration: ut11
display_name: "Управление торговлей 11"

entities:
  counterparty:
    entity_set: Catalog_Контрагенты
    fields:
      name: Description
      code: Code
      inn: ИНН            # TODO(verify)

  nomenclature:
