# Маппинг сущностей OData для «Бухгалтерия предприятия 3.0».
# Правило проекта: имена метаданных 1С НЕ хардкодятся в коде — только здесь.
# Ref_Key/Number/Date/Posted/DeletionMark/Code/Description — стандартные
# платформенные атрибуты (безопасно).
#
# ПРОВЕРЕНО 2026-07-31 на живой «Бухгалтерии предприятия (учебной)» 3.0.111.25:
# состав метаданных выгружен Конфигуратором и сверен пофамильно. Пометки
# TODO(verify) сняты с подтверждённых имён. Единственная ошибка — регистр
# «ВыручкаИСебестоимостьПродаж»: его в БП 3.0 нет (он из УТ), поэтому
# себестоимость берётся из строк документа реализации.
# Клиент по-прежнему сверяет имена с $metadata при подключении: у заказчика
# может стоять другая редакция или доработанная конфигурация.

configuration: bp30
display_name: "Бухгалтерия предприятия 3.0"

entities:
  counterparty:
    entity_set: Catalog_Контрагенты
    fields:
      name: Description
      code: Code
      inn: ИНН            # подтверждено на БП 3.0.111
      kpp: КПП            # подтверждено

  nomenclature:
    entity_set: Catalog_Номенклатура
    fields:
      name: Description
      code: Code
      brand: Производитель   # подтверждено: реквизит есть в типовой БП 3.0.111.
                             # У заказчика бренд может вестись в доп. реквизите —
                             # тогда поменяйте имя здесь.

  sale:                    # Реализация (акт, накладная)
    entity_set: Document_РеализацияТоваровУслуг
    fields:
      counterparty: Контрагент_Key   # подтверждено (реквизит «Контрагент»)
      total: СуммаДокумента          # подтверждено; это сумма С НДС
      # Реквизита НДС в шапке документа НЕТ — проверено роботом на живой
      # БП 3.0.111. НДС берётся из строк (row_fields ниже).
      comment: Комментарий           # подтверждено
    # Две части: товары и услуги. В базах, где продают услуги, «Товары»
    # пуста — проверено на живой БП 3.0.111 (все 21 реализация в «Услугах»).
    rows: [Товары, Услуги]           # подтверждено
    row_fields:                      # колонки табличной части, все подтверждены
      nomenclature: Номенклатура_Key
      quantity: Количество
      amount: Сумма                  # сумма строки С НДС
      vat: СуммаНДС
      cost: Себестоимость            # заполняется при проведении/закрытии месяца

  sales_return:            # Возврат товаров от покупателя
    entity_set: Document_ВозвратТоваровОтПокупателя
    fields:
      counterparty: Контрагент_Key   # подтверждено
      total: СуммаДокумента          # подтверждено (сумма С НДС)
    rows: Товары                     # подтверждено
    row_fields:                      # НДС и себестоимость — только здесь
      nomenclature: Номенклатура_Key
      amount: Сумма
      vat: СуммаНДС
      cost: Себестоимость

  purchase:                # Поступление (акт, накладная)
    entity_set: Document_ПоступлениеТоваровУслуг
    fields:
      counterparty: Контрагент_Key   # подтверждено
      total: СуммаДокумента          # подтверждено
    rows: Товары                     # подтверждено
    row_fields:                      # нужны для расчёта средней цены закупки
      nomenclature: Номенклатура_Key
      quantity: Количество
      amount: Сумма
      vat: СуммаНДС

  incoming_payment:        # Поступление на расчётный счёт
    entity_set: Document_ПоступлениеНаРасчетныйСчет
    fields:
      counterparty: Контрагент_Key   # подтверждено (реквизит «Контрагент»)
      total: СуммаДокумента          # подтверждено

  outgoing_payment:        # Списание с расчётного счёта
    entity_set: Document_СписаниеСРасчетногоСчета
    fields:
      counterparty: Контрагент_Key   # подтверждено
      total: СуммаДокумента          # подтверждено

  customer_invoice:        # Счёт на оплату покупателю
    entity_set: Document_СчетНаОплатуПокупателю
    fields:
      counterparty: Контрагент_Key   # подтверждено
      total: СуммаДокумента          # подтверждено
    rows: Товары                     # подтверждено
