[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "perimeter"
version = "0.1.0"
description = "Perimeter: air-gapped local AI worker with 1C integration (local inference only)"
requires-python = ">=3.12"
license = { text = "Proprietary" }
# Runtime dependencies are intentionally EMPTY: everything is either stdlib
# or vendored under vendor/ (see docs/deps.md). Rule #0: no code that can
# reach outside localhost / hosts listed in config/perimeter.yaml.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.package-dir]
perimeter_core = "core/perimeter_core"
perimeter_inference = "inference/perimeter_inference"
perimeter_bridge1c = "bridge-1c/perimeter_bridge1c"
perimeter_ui = "ui/perimeter_ui"

[tool.setuptools.packages.find]
where = ["core", "inference", "bridge-1c", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
