<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ui.title}}</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 1rem; }
  h1 { font-size: 1.1rem; }
  #log { border: 1px solid #8884; border-radius: 8px; padding: .75rem; min-height: 50vh;
         white-space: pre-wrap; overflow-y: auto; }
  .u { font-weight: 600; margin-top: .5rem; }
  .a { margin: .25rem 0 .75rem; }
  .report { margin: .5rem 0 1rem; border: 1px solid #8884; border-radius: 8px;
            overflow-x: auto; white-space: normal; }
  .report h2 { font-size: .85rem; margin: 0; padding: .5rem .7rem; background: #8881;
               font-weight: 600; }
  .report table { border-collapse: collapse; width: 100%; font-size: .88rem; }
  .report th, .report td { padding: .35rem .7rem; text-align: left; white-space: nowrap;
                           border-bottom: 1px solid #8883; }
  .report td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .report tr.total td { font-weight: 700; }
  .report tr.detail td { font-size: .8rem; opacity: .75; padding-left: 1.6rem;
                         white-space: normal; }
  .report .note { padding: .5rem .7rem; font-size: .8rem; opacity: .75;
                  white-space: pre-wrap; }
  form { display: flex; gap: .5rem; margin-top: .75rem; flex-wrap: wrap; }
  input[type=text] { flex: 1; padding: .5rem; min-width: 200px; }
  label { font-size: .85rem; align-self: center; }
</style>
</head>
<body>
<h1>{{ui.title}}</h1>
<div id="log"></div>
<form id="f">
  <input type="text" id="msg" placeholder="{{ui.placeholder}}" autocomplete="off">
  <label><input type="checkbox" id="approve"> разрешить создание черновика</label>
  <button>{{ui.send}}</button>
</form>
<script>
const log = document.getElementById("log");

const esc = (s) => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isNum = (c) => /^[\d\s.,+\-−%₽]+$/.test(c.trim()) && /\d/.test(c);

// Отчёт приходит строками «колонка | колонка». Таблицу собираем здесь, а не
// просим модель её пересказать — пересказ и был источником ошибок в цифрах.
function renderReport(r) {
  const rows = [], notes = [];
  r.text.split("\n").forEach((line, i) => {
    if (i === 0) { notes.push({head: line}); return; }
    // Строка с отступом — детализация предыдущей (документы по контрагенту).
    if (/^\s{2,}\S/.test(line)) rows.push({detail: line.trim()});
    else if (line.includes("|")) rows.push(line.split("|").map(c => c.trim()));
    else if (line.trim()) notes.push({text: line});
  });
  let html = `<div class="report"><h2>${esc(r.title || (notes[0] && notes[0].head) || "Отчёт")}</h2>`;
  if (rows.length) {
    html += "<table>";
    const cols = Math.max(...rows.filter(r => !r.detail).map(r => r.length));
    rows.forEach((cells, i) => {
      if (cells.detail) {
        html += `<tr class="detail"><td colspan="${cols}">${esc(cells.detail)}</td></tr>`;
        return;
      }
      const total = /^(ИТОГО|Итого)/.test(cells[0]);
      const tag = i === 0 && !total ? "th" : "td";
      html += `<tr${total ? ' class="total"' : ""}>` + cells.map(c =>
        `<${tag}${tag === "td" && isNum(c) ? ' class="num"' : ""}>${esc(c)}</${tag}>`).join("") + "</tr>";
    });
    html += "</table>";
  }
  const tail = notes.filter(n => n.text).map(n => esc(n.text)).join("\n");
  if (tail) html += `<div class="note">${tail}</div>`;
  return html + "</div>";
}
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg").value.trim();
  if (!msg) return;
  document.getElementById("msg").value = "";
  log.insertAdjacentHTML("beforeend", `<div class="u"></div><div class="a">{{ui.working}}</div>`);
  log.children[log.children.length - 2].textContent = "Вы: " + msg;
  const out = log.lastElementChild;
  const resp = await fetch("/api/chat", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({message: msg, approve_writes: document.getElementById("approve").checked}),
  });
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let acc = "", buf = "";
  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream: true});
    let idx;
    while ((idx = buf.indexOf("\n\n")) >= 0) {
      const line = buf.slice(0, idx).trim();
      buf = buf.slice(idx + 2);
      if (!line.startsWith("data:")) continue;
      const ev = JSON.parse(line.slice(5));
      if (ev.delta) { acc += ev.delta; out.textContent = acc; }
      if (ev.done !== undefined) {
        out.textContent = ev.done;
        (ev.reports || []).forEach(r => out.insertAdjacentHTML("afterend", renderReport(r)));
      }
      if (ev.error) out.textContent = "Ошибка: " + ev.error;
      log.scrollTop = log.scrollHeight;
    }
  }
});
</script>
</body>
</html>
