<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ui.title}}</title>
<style>
  /* Рабочее место бухгалтера, а не универсальный чат. Метафора — журнал
     запросов: поле подшивки слева, разлиновка, цифры табличными знаками.
     Палитра унаследована от лендинга. Ни одного внешнего ресурса (правило №0). */
  :root {
    --paper: #F6F7F4;
    --card: #FFFFFF;
    --ink: #1D2A34;
    --dim: #5D6B74;
    --rule: #E1E5DE;
    --green: #1E6B4F;
    --green-soft: #E8F1EB;
    --amber-ink: #8A6A1F;
    --amber-bg: #FBF3E1;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #151A18; --card: #1C2320; --ink: #E8EDE9; --dim: #9BA8A1;
      --rule: #2C3531; --green: #6FBF97; --green-soft: #1F2E27;
      --amber-ink: #E0BE72; --amber-bg: #2A2418;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.5;
    display: flex; flex-direction: column; -webkit-text-size-adjust: 100%;
  }

  header {
    flex: none; border-bottom: 1px solid var(--rule); background: var(--card);
    padding: .7rem 1rem; display: flex; align-items: baseline; gap: .6rem;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1rem; font-weight: 650; margin: 0; letter-spacing: -.01em; }
  header .where { font-size: .8rem; color: var(--dim); }
  header .dot {
    width: .5rem; height: .5rem; border-radius: 50%; background: var(--green);
    display: inline-block; margin-right: .35rem;
  }

  main { flex: 1 1 auto; overflow-y: auto; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 1rem 1rem 0; }

  /* Журнал: каждая пара «вопрос — ответ» — запись с полем подшивки слева. */
  .entry { border-left: 2px solid var(--rule); padding: 0 0 1.25rem 1rem; margin-left: .25rem; }
  .entry.active { border-left-color: var(--green); }
  .q { font-weight: 600; margin: 0 0 .5rem; }
  .a { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .a:empty::after { content: "{{ui.working}}"; color: var(--dim); font-style: italic; }
  .err {
    background: var(--amber-bg); color: var(--amber-ink); border-radius: 8px;
    padding: .5rem .7rem; font-size: .9rem;
  }

  /* Отчёты приходят готовой таблицей — их считает программа, не модель. */
  .report {
    margin: .75rem 0 0; border: 1px solid var(--rule); border-radius: 10px;
    overflow-x: auto; background: var(--card); white-space: normal;
  }
  .report h2 {
    font-size: .78rem; margin: 0; padding: .55rem .8rem; font-weight: 650;
    letter-spacing: .02em; text-transform: uppercase; color: var(--dim);
    border-bottom: 1px solid var(--rule);
  }
  .report table { border-collapse: collapse; width: 100%; font-size: .88rem; }
  .report th, .report td {
    padding: .4rem .8rem; text-align: left; white-space: nowrap;
    border-bottom: 1px solid var(--rule);
  }
  .report th { font-weight: 600; color: var(--dim); font-size: .78rem; }
  .report td.num {
    text-align: right; font-variant-numeric: tabular-nums;
    font-family: var(--mono); font-size: .84rem;
  }
  .report tr.total td { font-weight: 700; background: var(--green-soft); }
  .report tr.detail td {
    font-size: .8rem; color: var(--dim); padding-left: 2rem; white-space: normal;
  }
  .report .note {
    padding: .55rem .8rem; font-size: .8rem; color: var(--dim);
    white-space: pre-wrap; border-top: 1px solid var(--rule);
  }

  /* Бланк запроса: прижат к низу, растёт вместе с текстом. */
  footer {
    flex: none; background: var(--paper); border-top: 1px solid var(--rule);
    padding: .75rem 1rem calc(.75rem + env(safe-area-inset-bottom));
  }
  .composer { max-width: 820px; margin: 0 auto; }
  .chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .6rem; }
  .chip {
    font: inherit; font-size: .82rem; color: var(--dim); cursor: pointer;
    background: var(--card); border: 1px solid var(--rule); border-radius: 999px;
    padding: .3rem .7rem;
  }
  .chip:hover { border-color: var(--green); color: var(--green); }

  .field {
    display: flex; align-items: flex-end; gap: .5rem;
    background: var(--card); border: 1px solid var(--rule); border-radius: 12px;
    border-left: 3px solid var(--green); padding: .5rem .5rem .5rem .75rem;
  }
  .field:focus-within { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
  textarea {
    flex: 1; min-width: 0; border: 0; outline: 0; resize: none; background: transparent;
    color: inherit; font: inherit; line-height: 1.45; max-height: 40vh; padding: .35rem 0;
  }
  textarea::placeholder { color: var(--dim); }
  button.send {
    flex: none; border: 0; border-radius: 9px; cursor: pointer;
    background: var(--green); color: #fff; font: inherit; font-weight: 600;
    padding: .5rem .9rem;
  }
  button.send:disabled { opacity: .45; cursor: default; }
  .hint { font-size: .78rem; color: var(--dim); margin: .5rem .2rem 0; }

  .guard {
    display: flex; gap: .55rem; align-items: flex-start;
    margin: .6rem .2rem 0; font-size: .82rem; color: var(--dim);
  }
  .guard input { margin: .2rem 0 0; accent-color: var(--green); flex: none; }
  .guard b { color: var(--ink); font-weight: 600; }

  :focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  @media (max-width: 560px) {
    .wrap { padding-left: .75rem; padding-right: .75rem; }
    header, footer { padding-left: .75rem; padding-right: .75rem; }
    .chips { display: none; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>{{ui.title}}</h1>
  <span class="where"><span class="dot"></span>подключён к 1С · работает без интернета</span>
</header>

<main><div class="wrap" id="log"></div></main>

<footer>
  <div class="composer">
    <div class="chips" id="chips"></div>
    <form id="f">
      <div class="field">
        <textarea id="msg" rows="1" placeholder="{{ui.placeholder}}"
                  autocomplete="off" spellcheck="false"></textarea>
        <button class="send" id="send" type="submit" disabled>{{ui.send}}</button>
      </div>
      <label class="guard">
        <input type="checkbox" id="approve">
        <span><b>Разрешить создание черновика</b> — без этой галочки помощник
        только читает данные. Проведение документов остаётся за вами в 1С.</span>
      </label>
      <p class="hint">Enter — отправить, Shift+Enter — новая строка.</p>
    </form>
  </div>
</footer>

<script>
const esc = (s) => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isNum = (c) => /^[\d\s.,+\-−%₽]+$/.test(c.trim()) && /\d/.test(c);

// Отчёт приходит строками «колонка | колонка». Таблицу собираем здесь, а не
// просим модель её пересказать — пересказ и был источником ошибок в цифрах.
function renderReport(r) {
  const rows = [], notes = [];
  r.text.split("\n").forEach((line, i) => {
    if (i === 0) { notes.push({head: line}); return; }
    // Строка с отступом — детализация предыдущей (документы по контрагенту).
    if (/^\s{2,}\S/.test(line)) rows.push({detail: line.trim()});
    else if (line.includes("|")) rows.push(line.split("|").map(c => c.trim()));
    else if (line.trim()) notes.push({text: line});
  });
  let html = `<div class="report"><h2>${esc(r.title || (notes[0] && notes[0].head) || "Отчёт")}</h2>`;
  if (rows.length) {
    const cols = Math.max(...rows.filter(r => !r.detail).map(r => r.length));
    html += "<table>";
    rows.forEach((cells, i) => {
      if (cells.detail) {
        html += `<tr class="detail"><td colspan="${cols}">${esc(cells.detail)}</td></tr>`;
        return;
      }
      const total = /^(ИТОГО|Итого)/.test(cells[0]);
      const tag = i === 0 && !total ? "th" : "td";
      html += `<tr${total ? ' class="total"' : ""}>` + cells.map(c =>
        `<${tag}${tag === "td" && isNum(c) ? ' class="num"' : ""}>${esc(c)}</${tag}>`).join("") + "</tr>";
    });
    html += "</table>";
  }
  const tail = notes.filter(n => n.text).map(n => esc(n.text)).join("\n");
  if (tail) html += `<div class="note">${tail}</div>`;
  return html + "</div>";
}

// Примеры формулировок, на которых замерена точность выбора инструмента:
// заодно подсказывают человеку словарь, который помощник понимает уверенно.
const EXAMPLES = [
  "Кто нам должен и сколько?",
  "Сделай ABC-анализ по товарам",
  "Посчитай себестоимость проданного",
  "Покажи прибыли и убытки",
  "Сделай акт сверки с Ромашкой",
];

// --- ГРАНИЦА: выше — чистые функции, ниже — работа с DOM. По этой строке
// тест tests/unit/test_ui_render.js вырезает рендер отчёта и проверяет его
// в node. Не убирайте её и не переносите функции ниже.

const log = document.getElementById("log");
const form = document.getElementById("f");
const msg = document.getElementById("msg");
const send = document.getElementById("send");
const approve = document.getElementById("approve");
const chips = document.getElementById("chips");

EXAMPLES.forEach(text => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.textContent = text;
  b.addEventListener("click", () => { msg.value = text; sync(); msg.focus(); });
  chips.appendChild(b);
});

function sync() {
  send.disabled = !msg.value.trim();
  msg.style.height = "auto";
  msg.style.height = Math.min(msg.scrollHeight, window.innerHeight * 0.4) + "px";
}
msg.addEventListener("input", sync);
msg.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
sync();

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = msg.value.trim();
  if (!text) return;
  msg.value = ""; sync();
  chips.style.display = "none";

  const entry = document.createElement("div");
  entry.className = "entry active";
  const q = document.createElement("p"); q.className = "q"; q.textContent = text;
  const a = document.createElement("div"); a.className = "a";
  entry.append(q, a);
  log.appendChild(entry);

  const scroller = log.parentElement;
  const toBottom = () => { scroller.scrollTop = scroller.scrollHeight; };
  toBottom();
  msg.disabled = true; send.disabled = true;

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text, approve_writes: approve.checked}),
    });
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let acc = "", buf = "";
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 2);
        if (!line.startsWith("data:")) continue;
        const ev = JSON.parse(line.slice(5));
        if (ev.delta) { acc += ev.delta; a.textContent = acc; }
        if (ev.done !== undefined) {
          a.textContent = ev.done;
          (ev.reports || []).forEach(r => a.insertAdjacentHTML("afterend", renderReport(r)));
        }
        if (ev.error) { a.className = "a err"; a.textContent = "Ошибка: " + ev.error; }
        toBottom();
      }
    }
  } catch (err) {
    a.className = "a err";
    a.textContent = "Не удалось получить ответ: " + err;
  } finally {
    entry.classList.remove("active");
    msg.disabled = false; sync(); msg.focus();
  }
});
</script>
</body>
</html>
